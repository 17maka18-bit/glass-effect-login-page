<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width", initial-scale=1.0">
    <title>Glassmorphism Login</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <form>

    <main class="login-wrapper">

        <!-- Figma decorations -->

        <div class="decorations" aria-hidden="true">


        <img src="images/Group.png" class="shape shape-1" alt="snake">
        <img src="images/Group 1.png" class="shape shape-2" alt="snake-2">\
        <img src="images/Group 2.png" class="shape shape-3" alt="snake-3">
        <img src="images/Group 4.png" class="shape shape-4" alt="snake-4">
        <img src="images/Group 5.png" class="shape shape-5" alt="snake-5">

        </div>

        <section class="login-card">

            <header class="login-header">
                <div class="logo">Your logo</div>
                <h1>Login</h1>
            </header>

            <!-- Login Form-->
             <form class="login-form">

                <div class="input-group">
                    <label for="email>Email"></label>
                    <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                    >
                </div>
              <div class="input-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          >
        </div>

        <a href="#" class="forgot-password">
          Forgot Password?
        </a>

        <button type="submit" class="sign-in">
          Sign In
        </button>

      </form>

      <p class="divider">or continue with</p>

      <!-- Social Login -->
      <div class="social-login">

        <button type="button" aria-label="Google">
          <img
            src="https://cdn.jsdelivr.net/npm/simple-icons@v15/icons/google.svg"
            alt=""
          >
        </button>

        <button type="button" aria-label="GitHub">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path fill="currentColor" d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.56v-2.15c-3.2.7-3.87-1.36-3.87-1.36-.52-1.33-1.28-1.69-1.28-1.69-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.76 2.7 1.25 3.36.96.1-.75.4-1.25.73-1.54-2.56-.29-5.26-1.28-5.26-5.7 0-1.26.45-2.29 1.19-3.1-.12-.29-.52-1.47.11-3.06 0 0 .97-.31 3.16 1.18a11 11 0 0 1 5.75 0c2.19-1.49 3.16-1.18 3.16-1.18.63 1.59.23 2.77.11 3.06.74.81 1.19 1.84 1.19 3.1 0 4.43-2.7 5.4-5.27 5.69.41.36.78 1.07.78 2.16v3.2c0 .31.21.68.8.56A11.51 11.51 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5Z"/>
          </svg>
        </button>

        <button type="button" aria-label="Facebook">
          <img
            src="https://cdn.jsdelivr.net/npm/simple-icons@v15/icons/facebook.svg"
            alt=""
          >
        </button>

      </div>

      <!-- Register -->
      <p class="register">
        Don't have an account?
        <a href="#">Register for free</a>
      </p>

    </section>

  </main>

</body>
</html>
